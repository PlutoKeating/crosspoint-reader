name: StockStick Release
on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Check tag matches firmware version
        run: |
          VERSION=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c['crosspoint']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$VERSION" || { echo "tag $GITHUB_REF_NAME != version $VERSION"; exit 1; }

      - name: Build and package StockStick release
        run: |
          NOTES=RELEASE_NOTES.md
          test -f "$NOTES" || NOTES=""
          python3 scripts/firmware_release.py --build ${NOTES:+--notes "$NOTES"}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StockStick-${{ github.ref_name }}
          path: |
            dist/firmware/
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/partitions.bin
            .pio/build/gh_release/firmware.map
